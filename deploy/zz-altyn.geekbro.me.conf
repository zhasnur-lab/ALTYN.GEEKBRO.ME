# nginx vhost: altyn.geekbro.me — ресторан «ALTYN» (Усть-Каменогорск).
# Всё проксируется в Node (:4326, systemd --user altyn.service).
# Префикс zz- намеренно: не стать default_server на :443 для чужих хостов.
server {
    server_name altyn.geekbro.me;
    listen 80;
    listen [::]:80;
    client_max_body_size 60m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/staff/stream {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
