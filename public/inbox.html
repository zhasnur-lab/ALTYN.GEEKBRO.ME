<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>ALTYN — загрузка фото и видео</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#1c1410;color:#f3e6cf;padding:24px 18px 60px}
.w{max-width:560px;margin:0 auto}h1{font:600 30px Georgia,serif;color:#e3c58c;margin:6px 0 8px}
p{color:#cdb99a;margin:0 0 14px}.pick{display:block;text-align:center;padding:22px;border:2px dashed #c1964f;border-radius:18px;font-weight:700;font-size:18px;color:#1c1208;background:linear-gradient(135deg,#f0d49c,#c1964f);cursor:pointer}
ul{list-style:none;padding:0;margin:18px 0 0}li{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e3c58c}
.ok{color:#8fd19e}.err{color:#ff8a7a}small{color:#9d8b73}
</style></head><body><div class="w">
<h1>ALTYN · фото и видео</h1>
<p>Выберите из галереи телефона красивые фото и видео: блюда, залы, интерьер, кухня, мангал. Лучше без людей в кадре или с согласия гостей. Можно сразу много файлов.</p>
<label class="pick">📷 Выбрать фото и видео<input id="f" type="file" accept="image/*,video/*" multiple hidden></label>
<p style="margin-top:12px"><small>Видео — до 60 МБ на файл (если больше, отправьте в 1080p). Не закрывайте страницу, пока всё не загрузится.</small></p>
<ul id="list"></ul></div>
<script>
const k=new URLSearchParams(location.search).get('k');
document.getElementById('f').onchange=async e=>{
  for(const file of e.target.files){
    const li=document.createElement('li'); li.innerHTML=`${file.name} · ${(file.size/1e6).toFixed(1)} МБ<div class="bar"><i></i></div>`; document.getElementById('list').prepend(li);
    if(file.size>60e6){ li.insertAdjacentHTML('beforeend','<div class="err">Слишком большой файл (больше 60 МБ)</div>'); continue; }
    await new Promise(done=>{
      const x=new XMLHttpRequest(); x.open('POST',`/api/inbox?k=${encodeURIComponent(k)}&name=${encodeURIComponent(file.name)}`);
      x.upload.onprogress=ev=>{ li.querySelector('i').style.width=(100*ev.loaded/ev.total)+'%'; };
      x.onload=()=>{ li.insertAdjacentHTML('beforeend', x.status===200?'<div class="ok">✓ Загружено</div>':`<div class="err">Ошибка ${x.status}</div>`); done(); };
      x.onerror=()=>{ li.insertAdjacentHTML('beforeend','<div class="err">Нет сети — попробуйте ещё раз</div>'); done(); };
      x.send(file);
    });
  }
};
</script></body></html>
